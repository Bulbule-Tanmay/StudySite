function rank(type){ return type === 'unit' ? 0 : (type === 'misc' ? 1 : 2); }
function prettifyGroup(key, type){
  if (type === 'pyq') return 'Previous Year Questions';
  if (type === 'misc') return 'Other Files';
  return key.replace(/_/g,' ').replace(/\s+/g,' ').trim();
}
function buildSubjects() {
  const subjects = [];
  for (const code of Object.keys(TREE.Files)) {
    const raw = TREE.Files[code];
    const groups = [];
    let totalFiles = 0;
    for (const groupKey of Object.keys(raw)) {
      const files = raw[groupKey];
      totalFiles += files.length;
      const lower = groupKey.toLowerCase();
      let type = 'unit';
      if (lower.includes('pyq')) type = 'pyq';
      else if (lower.includes('root_files')) type = 'misc';
      groups.push({ label: prettifyGroup(groupKey, type), rawKey: groupKey, type, files });
    }
    groups.sort((a, b) => rank(a.type) - rank(b.type));
    const meta = ICONS[code] || { icon: 'folder', tint: 'sky' };
    subjects.push({ code, name: FULL_NAMES[code] || code, icon: meta.icon, tint: meta.tint, groups, totalFiles });
  }
  return subjects;
}

let FAVORITES = []; // {code,file}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
}
function escapeAttr(text) {
  return escapeHtml(text).replace(/`/g, '&#96;');
}
function toToken(value) {
  return encodeURIComponent(value);
}
function fromToken(value) {
  return decodeURIComponent(value);
}
function favKey(code, file) { return `${code}::${file}`; }
function isFav(code, file) { return FAVORITES.some(entry => favKey(entry.code, entry.file) === favKey(code, file)); }

function fileExt(name) {
  const match = String(name).match(/\.([a-zA-Z0-9]+)$/);
  return match ? match[1].toUpperCase() : 'FILE';
}

function go(view, subjectCode) {
  STATE.view = view;
  if (view !== 'detail') STATE.currentSubject = null;
  document.querySelectorAll('.view').forEach(section => section.classList.remove('active'));
  const target = document.getElementById(`view-${view}`);
  if (target) target.classList.add('active');
  syncNav();
  updateTopbar();
  closeSearch();
  window.scrollTo({ top: 0, behavior: 'instant' });
  if (view === 'detail' && subjectCode) openDetail(subjectCode);
}

function syncNav() {
  const active = STATE.view === 'detail' ? 'subjects' : STATE.view;
  document.querySelectorAll('[data-nav]').forEach(element => {
    element.classList.toggle('active', element.getAttribute('data-nav') === active);
  });
}

function updateTopbar() {
  const title = document.getElementById('topbar-title');
  const subtitle = document.getElementById('topbar-subtitle');
  if (STATE.view === 'detail' && STATE.currentSubject) {
    const subject = SUBJECT_MAP[STATE.currentSubject];
    title.textContent = subject ? subject.name : 'Subject Details';
    subtitle.textContent = subject ? subject.code : 'Subject Details';
    return;
  }
  const labels = {
    home: ['College Notes Index', 'Welcome back'],
    subjects: ['Subject Explorer', `${SUBJECTS.length} active subjects`],
    favorites: ['Your Favorites', `${FAVORITES.length} saved files`],
    profile: ['Support & Contact', 'Need help or want to contribute?'],
  };
  const [nextTitle, nextSubtitle] = labels[STATE.view] || labels.home;
  title.textContent = nextTitle;
  subtitle.textContent = nextSubtitle;
}

function toggleFav(code, file) {
  if (isFav(code, file)) {
    FAVORITES = FAVORITES.filter(entry => favKey(entry.code, entry.file) !== favKey(code, file));
  } else {
    FAVORITES.push({ code, file });
  }
  renderHome();
  renderFavorites();
  if (STATE.view === 'subjects') renderSubjects();
  if (STATE.view === 'detail' && STATE.currentSubject) renderDetail(STATE.currentSubject);
  updateTopbar();
}

function pdfPathCandidates(code, filename) {
  const subject = TREE.Files?.[code] || {};
  const candidates = [];
  for (const [groupKey, files] of Object.entries(subject)) {
    if (!files.includes(filename)) continue;
    if (groupKey.toLowerCase().includes('root_files')) candidates.push(`Files/${code}/${filename}`);
    else candidates.push(`Files/${code}/${groupKey}/${filename}`);
  }
  candidates.push(`Files/${code}/${filename}`);
  return [...new Set(candidates)];
}

async function resolvePdfPath(code, filename) {
  const candidates = pdfPathCandidates(code, filename);
  for (const rawPath of candidates) {
    const path = encodeURI(rawPath);
    try {
      const response = await fetch(path, { method: 'HEAD' });
      if (response.ok) return path;
    } catch (error) {
      // try next candidate
    }
  }
  return encodeURI(candidates[0]);
}

async function openPdf(code, filename) {
  const popup = window.open('about:blank', '_blank', 'noopener');
  const path = await resolvePdfPath(code, filename);
  if (popup) popup.location.href = path;
  else window.location.href = path;
}

function closeSearch() {
  const overlay = document.getElementById('search-overlay');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

function runSearch(queryText) {
  const overlay = document.getElementById('search-overlay');
  const results = document.getElementById('search-results');
  const query = queryText.trim().toLowerCase();
  if (!query) {
    closeSearch();
    results.innerHTML = '';
    return;
  }
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  const hits = [];
  for (const subject of SUBJECTS) {
    if (subject.code.toLowerCase().includes(query) || subject.name.toLowerCase().includes(query)) {
      hits.push({ type: 'subject', subject });
    }
    for (const group of subject.groups) {
      for (const file of group.files) {
        if (file.toLowerCase().includes(query)) hits.push({ type: 'file', subject, group, file });
      }
    }
  }

  if (!hits.length) {
    results.innerHTML = `<div class="card-soft p-4 text-slate-300">No matches for <span class="mono">${escapeHtml(queryText)}</span>.</div>`;
    return;
  }

  results.innerHTML = hits.slice(0, 60).map(hit => {
    if (hit.type === 'subject') {
      const tint = TINT_STYLE[hit.subject.tint] || TINT_STYLE.sky;
      return `<button class="card-soft card-hover w-full p-4 text-left flex items-center gap-3" data-open-subject="${escapeAttr(hit.subject.code)}">
        <span class="w-10 h-10 rounded-xl border ${tint} flex items-center justify-center shrink-0"><span class="material-symbols-outlined">${hit.subject.icon}</span></span>
        <span class="min-w-0"><span class="block text-slate-100 font-medium truncate">${escapeHtml(hit.subject.code)} · ${escapeHtml(hit.subject.name)}</span><span class="block text-xs text-slate-400 mt-0.5">Subject</span></span>
      </button>`;
    }
    return `<button class="card-soft card-hover w-full p-4 text-left flex items-center gap-3" data-open-file="1" data-code="${escapeAttr(hit.subject.code)}" data-file="${escapeAttr(toToken(hit.file))}">
      <span class="w-10 h-10 rounded-xl border border-red-300/35 bg-red-400/20 text-red-100 flex items-center justify-center shrink-0"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">picture_as_pdf</span></span>
      <span class="min-w-0"><span class="block text-slate-100 font-medium truncate">${escapeHtml(hit.file)}</span><span class="block text-xs text-slate-400 mt-0.5 truncate">${escapeHtml(hit.subject.code)} · ${escapeHtml(hit.group.label)}</span></span>
    </button>`;
  }).join('');
}

function sendMessage() {
  alert('Thanks! This demo form doesn\'t send anywhere yet — wire it up to your backend or a form service like Formspree.');
}

document.addEventListener('click', event => {
  const route = event.target.closest('[data-route]');
  if (route) {
    go(route.getAttribute('data-route'));
    return;
  }

  const chip = event.target.closest('[data-chip]');
  if (chip) {
    STATE.chip = chip.getAttribute('data-chip');
    renderSubjects();
    return;
  }

  const openSubjectButton = event.target.closest('[data-open-subject]');
  if (openSubjectButton) {
    const code = openSubjectButton.getAttribute('data-open-subject');
    go('detail', code);
    return;
  }

  const fileButton = event.target.closest('[data-open-file]');
  if (fileButton) {
    const code = fileButton.getAttribute('data-code');
    const file = fromToken(fileButton.getAttribute('data-file'));
    openPdf(code, file);
    return;
  }

  const favButton = event.target.closest('[data-toggle-fav]');
  if (favButton) {
    const code = favButton.getAttribute('data-code');
    const file = fromToken(favButton.getAttribute('data-file'));
    toggleFav(code, file);
    return;
  }
});

document.getElementById('search-input').addEventListener('input', event => runSearch(event.target.value));
document.getElementById('search-close').addEventListener('click', closeSearch);
document.getElementById('search-overlay').addEventListener('click', event => {
  if (event.target.id === 'search-overlay') closeSearch();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeSearch();
});

renderHome();
renderSubjects();
renderFavorites();
renderProfile();
go('home');
</script>
</body>
